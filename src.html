["12.11.","Tastatur auf allen Geräten gleich: Buchstabentasten Background/0, Funktionstasten (Richtung, Liste, Löschen) Background/20, harter 1-px-Schatten. Die umgekehrte Färbung im Tablet-Querformat entfällt.","Eine Tastatur in Prototyp und Figma; Tablet hoch ist die Vorlage."],
["12.11.","Bei offener Liste bleibt die Fragekarte vollständig (Frage ausblenden ausprobiert und verworfen). Die aktive Zeile scrollt ins obere Drittel, sobald sie unter 70 % der Listenhöhe rutscht.","Die Karte mit Frage fühlt sich besser an; die aktive Frage bleibt in der Liste im Blick."],
["12.11.","Erklärung in Listen (Fragenliste, Lösungsliste) heißt wie im Spielfeld „✓ So ist es gemeint“ (14 px, Text/70), ohne grauen Kasten.","Gleiches Element überall erkennbar; ein Kasten würde in der Liste mit der grauen aktiven Zeile verwechselt."],
["12.11.","4 px Abstand zwischen den Fragen in der Liste (Token XXXS).","Hover-Rahmen und aktive Fläche kleben nicht mehr aneinander."],
["12.11.","Fragenliste als Sheet (Handy, Tablet hoch) bleibt offen, wenn man eine andere Frage antippt – man spielt in der Liste weiter. Schließen nur über ✕, Wischen, Listentaste oder Esc.","Wer die Liste öffnet, will dort lesen und spielen, nicht zurück ins Raster geworfen werden."],
["12.11.","Hinweis „Richtig – weiter mit …“ unter der gelösten Antwort entfällt auf allen Geräten; Screenreader bekommen weiter eine Ansage.","Grüne Felder mit Haken zeigen „richtig“ schon eindeutig, die Erklärung folgt darunter; weiter geht es über die Pfeile."],
["12.11.","Werkzeugleiste der Fragekarte leise (Fassung B2): Pfeile ohne Kontur (Text/70, Fläche bei Hover), Prüfen als Pillen-Knopf mit Haken statt Schalter – aus grau (Background/20), an grün getönt (Success 16 %) und fett. Am Desktop Tastenkürzel im Tasten-Look.","Frage und Antwort führen; die Leiste spricht dieselbe Formsprache wie Tasten und Felder."],
["12.11.","Fragenliste: Fragen auf allen Geräten 16 px (Handy vorher 14), Nummer, Status und Erklärung 14 px; Felder bleiben je Gerät gestaffelt. Sheet-Kopf der Fragenliste ist die Library-Komponente „_Modal & Sheet Header“.","Fragen sind Inhalt und auf dem Handy der Ort zum Lesen – kein Größensprung zwischen Liste und Fragekarte."],
["11.11.","Tablet quer: Listentaste in der Tastatur (rechts neben L, wie auf Tablet hoch) blendet die Fragenliste ein und aus; blau, solange die Liste offen ist. Ohne Liste rückt das Spiel mittig auf 720 px. Revidiert „Fragen ausgeblendet (verworfen)“ vom 28.10.","Gleiche Bedeutung der Listentaste auf allen Tablets; im Querformat bekommt das Raster bei Bedarf mehr Platz – wie am Desktop über den Fragen-Schalter."],
["11.11.","Listenfelder auf Tablet und Desktop größer: 20 × 24 (Buchstabe 14), aktive Frage 24 × 28 (16); Handy bleibt 14 × 18 / 18 × 22. Lange Wörter werden schmaler, mindestens 14 px.","Die Feldgröße folgt der Schriftgröße der Frage; im breiten Tablet-Sheet waren die Felder zu klein."],
["28.10.","Einführung in fünf Schritten nach Figma-Tutorial, beim ersten Besuch automatisch, sonst im Menü unter „Einführung“.","Neue Spielende kennen Richtungswechsel, Eingabe-Modus und Prüfen sonst nicht."],
["28.10.","„Zum nächsten Rätsel“ und „Frühere Rätsel“ öffnen das Rätsel-Archiv; Meldungen sitzen immer 8 px über der Zoom-Pille; Handy-Fragenliste mit Sheet-Kopf wie alle Sheets.","Keine toten Enden, einheitliche Positionen."],
["28.10.","Desktop: keine Zoom-Pille mehr (Zoom per Strg + Mausrad/Doppelklick); Fragekarte 16 px unter dem Raster; mit Fragen sitzt die Karte direkt unter dem 520er-Raster, die Liste hält die Gesamthöhe.","Weniger Leerraum, Gesamthöhe bleibt beim Umschalten gleich."],
["28.10.","Abstand Raster → Fragekarte einheitlich 16 px (Desktop, Tablet quer); Handy und Tablet hoch behalten die Pillen im Spielfeld.","Ruhigeres, einheitliches Raster."],
["28.10.","Kein Fortschrittsbalken, keine Meilenstein-Meldungen.","Lenkt vom Rätseln ab."],
["28.10.","Tablet quer: Tasten 40 px hoch.","Freigegebene Figma-Fassung B."],
["28.10.","Umsetzung in Angular; Empfehlungen siehe „Für Produkt & Entwicklung“.","Technischer Rahmen des Teams."],
["17.11.","Bei Prüfen trägt jede richtige Kachel im Raster den kleinen Haken unten rechts, nicht mehr nur das letzte Feld eines gelösten Worts. Revidiert den Eintrag vom 11.11.","Richtig und falsch sind je Buchstabe gleich deutlich markiert; auch halb gelöste Wörter zeigen, was stimmt."],
["17.11.","Listen-Feinschliff: Zeilen sind aktiv und inaktiv gleich hoch (die Felderzeile reserviert die Höhe der größeren Felder), die aktive Frage ist nicht mehr fett, Frage 16 px mit Zeilenhöhe 22, „n falsch“ steht rechts in der Felderzeile, Hover ist eine helle Fläche (halbe Stärke der aktiven Zeile) statt eines Rahmens.","Nichts springt beim Wechsel der Frage, und die Frage bricht mit und ohne Prüfen gleich um."],
["17.11.","Liste: Nummernspalte 24 px, Inhalt mittig – Nummer, gelbe Pille (14 px fett, mindestens 24 px breit), Pfeil im Trenner und Haken der Erklärung liegen auf einer Achse; Frage, Felder, Trenner-Titel und Erklärung beginnen an derselben Kante.","Eine ruhige linke Kante statt vier leicht versetzter."],
["17.11.","Trenner „Waagerecht“ / „Senkrecht“: Titel fett 16 px und Zähler 14 px auf allen Geräten, Linie 2 px. Ohne Prüfen zählt er „n von m ausgefüllt“ mit Linie in Textfarbe, mit Prüfen „n von m gelöst“ mit grüner Linie. 64 px Abstand zwischen der letzten Frage und dem nächsten Trenner.","Ohne Prüfen verrät der Zähler nicht, was richtig ist; der größere Abstand trennt die Richtungen klar."],
["17.11.","Listenfelder in genau drei Größen: 16 × 20, 20 × 24, 24 × 28. Handy 16 × 20, aktiv 20 × 24; Tablet und Desktop 20 × 24, aktiv 24 × 28. Richtig: Feld in Hintergrundfarbe mit grünem Rahmen, Haken im Feld unten rechts. Falsch: 8 % Rot, roter Rahmen, durchgehender Durchstrich hinter dem Buchstaben; nichts ragt über das Feld.","Eine Größenskala für alle Geräte; die Marken überlappen keine Nachbarfelder mehr."],
["17.11.","Desktop: Raster 892 px ohne und 520 px mit Fragenliste, Fragekarte 660 px bzw. so breit wie die Rasterspalte; Zoom-Pille rechts in der Leiste unter dem Raster wie am Tablet; 8 px zwischen Fragekarte und Tastenkürzeln. Revidiert „keine Zoom-Pille“ vom 28.10.","Zoom ist am Desktop sichtbar und an derselben Stelle wie am Tablet; die Tastenkürzel gehören zur Karte."],
["17.11.","Tablet quer: Fragenliste mit einem 1-px-Rahmen, ohne Schatten.","Die Liste liegt in der Fläche und schwebt nicht darüber."],
["17.11.","Idee „Mitspieler“ verworfen.","Wird nicht weiterverfolgt."],["17.11.","Frage auf Tablet und Desktop in 18 statt 20 px; Tablet quer mit 16 px Abständen in der Fragekarte.","Angleich an die Figma-Komponente „Eingabebereich“."]];
const DEVINFO=[
["Layouts je Gerät",`<ul><li><b>Handy hoch:</b> Raster oben, Fragekarte und eigene Tastatur unten. Fragenliste als Sheet (Taste „Liste“).</li><li><b>Handy quer:</b> Hinweis „Bitte drehen“, Spielstand bleibt.</li><li><b>Tablet hoch:</b> wie Handy, Tasten 56 px.</li><li><b>Tablet quer und Desktop:</b> Schalter „Fragen“ in der Navigation (Standard aus). Desktop nach Figma „alte welt“: Inhaltsspalte 892 px (274–1166 bei 1440). Aus: Raster 892 × 545, Fragekarte 660 px mittig darunter. An: Raster 520 px und Liste 340 px rechts (Abstand 32). Die Spielfeld-Box bleibt in beiden Zuständen gleich hoch – mit Liste sitzt das kleinere Raster mittig darin, die Karte bleibt stehen.</li><li><b>Prüfen:</b> Tablet und Desktop in der Navigation (links neben „Fragen“), Handy in der Fragekarte (Schalter neben der Nummern-Pille, entschieden 13.11.).</li><li><b>Desktop:</b> Hardware-Tastatur – Buchstaben, Tab = nächste Frage, Leertaste = Richtung, Rücktaste = löschen. Druck-Knopf in der Leiste öffnet „Als PDF herunterladen“.</li></ul>`],
["Spielfeld mitwachsen (Handy)",`<ul><li><b>Zone 1, 0–50 px Scroll:</b> der ZEIT-Kopf scrollt 1:1 weg, das Spielfeld wächst um dieselbe Höhe, die Tastatur bleibt unten stehen.</li><li><b>Einrasten:</b> nie halb. Beim Loslassen entscheidet das Tempo (über 0,25 px/ms nach Richtung), sonst reichen 12 px Weg. Zielzustände: Seite (0) oder Spiel (50).</li><li><b>Zone 2:</b> zäher Übergang zu den Inhalten darunter – 140 px Fingerweg mit Faktor 0,3. Darunter federt es zurück auf „Spiel“, darüber scrollt es frei mit Schwung.</li><li>Tippen und „Weiterspielen“ holen in den Spiel-Zustand zurück. Abschaltbar unter Einstellungen („Spielfeld mitwachsen“, Standard an).</li><li>Nicht auf dem Tablet: das Raster ist dort breitenbegrenzt, mehr Höhe brächte nur Leerraum.</li></ul>`],
["Zoom und Kamera",`<ul><li>Zoom 100–300 % per Pille (Faktor 1,5), Pinch, Doppeltipp, Strg + Mausrad. Am Desktop sitzt die Zoom-Pille rechts in der Leiste unter dem Raster (wie am Tablet), zusätzlich Strg + Mausrad und Doppelklick.</li><li><b>Wortwechsel:</b> Zoom = selbst gewählter Zoom, aber höchstens so groß, dass das Wort mit einer Zelle Rand ins Bild passt. Kamerafahrt 320 ms, cubic-bezier(.2,0,0,1), jederzeit unterbrechbar.</li><li>Scroll-Indikatoren nur, wenn gezoomt ist und das Raster übersteht.</li><li>Prüfen- und Zoom-Pille blenden beim Tippen aus und kommen nach 1,5 s zurück. Auf dem Desktop hat die Zoom-Pille eine eigene Leiste unter dem Raster (34 px hoch, je 8 px Abstand zu Raster und Fragekarte) und bleibt beim Tippen stehen.</li></ul>`],
["Tastatur (Handy, Tablet)",`<ul><li>Mit Tasten-Lupe zählt der Buchstabe beim Loslassen, ohne Lupe beim Aufsetzen.</li><li><b>Gleiten:</b> erst ab 10 px Fingerweg; die Nachbartaste gilt erst, wenn der Finger 4 px in ihr ist. Setzt ein zweiter Finger auf, zählt der erste sofort (Rollover).</li><li><b>Löschen:</b> sofort, beim Halten nach 450 ms alle 90 ms.</li><li>Lupe wächst mit der Tastengröße. Haptik über navigator.vibrate (nur Android, iOS kann im Web nicht vibrieren), Töne über Web Audio.</li><li>Einstellung „Ausgefüllte Felder überspringen“ springt zum nächsten leeren Feld.</li></ul>`],
["Tastatur am Desktop (Stand 11.11.)",`<ul><li><b>Im Rätsel</b> (Fokus auf der Seite oder im Raster): Buchstaben schreiben, ⌫ löscht, <kbd>Tab</kbd>/<kbd>⇧ Tab</kbd> nächste/vorige Frage, <kbd>Leertaste</kbd> Richtung wechseln (ohne kreuzendes Wort nur Hinweis, kein Sprung), Pfeile bewegen den Cursor im Wort.</li><li><b>Auf einem Bedienelement</b> (Knopf, Schalter, Listenzeile): Tab, Leertaste, Enter und Pfeile wirken nativ auf das Element. Ein Buchstabe oder ⌫ geht trotzdem ins Rätsel und holt den Fokus zurück.</li><li>Tab-Reihenfolge der Navigation folgt der sichtbaren Reihenfolge (Zurück / Kalender / Fragen / Drucken / ⋯). Ein Bedienelement gibt den Fokus ans Rätsel zurück, sobald ein Buchstabe getippt wird.</li><li>Mausklick auf Knöpfe nimmt ihnen den Fokus nicht ab vom Rätsel (mousedown ohne Fokuswechsel), damit Leertaste/Enter danach aufs Spiel wirken.</li><li>Listenzeilen sind Knöpfe (role=button, Enter/Leertaste), aktive Zeile mit aria-current.</li></ul>`],
["Desktop-Höhe (Stand 11.11.)",`<ul><li>Rasterbreite = min(892 px bzw. 520 px mit Fragen, (Fensterhöhe − 175 Kopf/Navigation − 50 Leiste mit Zoom-Pille − 142 Fragekarte − 28 Hinweiszeile − 24 Rand) × 18/11), mindestens 360 px Höhe. Bei Größenänderung neu berechnen.</li><li>Fragenliste: Höhe = min(Raster 892 + Fragekarte, Fensterhöhe − Oberkante Liste − 24 px), Inhalt scrollt in sich.</li><li>Fragenwechsel: Austritt 120 ms (8 px, Blur 1 px), Eintritt 200 ms (8 px, Blur 1,5 px → 0), cubic-bezier(.2,0,0,1).</li></ul>`],
["Fragenliste (Tablet quer, Desktop)",`<ul><li>Die Liste folgt dem aktiven Wort bei jedem Wechsel (Klick, Tab, Enter, Richtungswechsel, Weiterspringen). Sie scrollt nur, wenn die Zeile nicht ganz sichtbar ist, dann weich auf ein Drittel der Höhe.</li><li>Zähler im Trenner: ohne Prüfen „n von m ausgefüllt“ (vollständig ausgefüllte Wörter, Linie in Textfarbe), mit Prüfen „n von m gelöst“ (nur richtige Wörter, Linie grün). Die Linie (2 px) folgt demselben Verhältnis.</li><li>Listenfelder in drei Größen: Handy 16 × 20, aktiv 20 × 24; Tablet und Desktop 20 × 24, aktiv 24 × 28. Die Felderzeile ist immer so hoch wie die aktiven Felder, die Zeile springt nicht. Passt ein sehr langes Wort nicht in die Zeile, werden seine Felder schmaler.</li><li>Meldungen (Prüfen, Hinweise) mittig über der linken Spalte; am Desktop in der Hinweiszeile unter der Fragekarte statt über dem Raster.</li></ul>`],
["Tippen gegen Wischen",`<ul><li>Die Richtung wird überall nach 8 px Weg entschieden (Seite, Fragen-Karussell, Sheets). Bis dahin ist es ein Tipp.</li><li>Nach einer Wischgeste werden Klicks 350 ms lang verschluckt – kein versehentliches Auswählen nach dem Scrollen.</li><li><b>Fragen-Karussell:</b> die Frage folgt dem Finger 1:1, Nachbarfragen liegen bereit. Wechsel ab 25 % Breite oder 0,3 px/ms, läuft im Kreis.</li></ul>`],
["Sheets und Dialoge",`<ul><li>Handy: Bottom-Sheet. Tablet und Desktop: Modal, 560 px breit. Aufbau nach Figma „_Modal &amp; Sheet Header/Footer“.</li><li>Seite dahinter gesperrt. Escape und Abdunkelung schließen, Fokus bleibt im Dialog und kehrt danach zum Auslöser zurück.</li><li><b>Wisch nach unten:</b> am Kopf immer, im Inhalt nur, wenn er ganz oben steht. Schließt ab 25 % Höhe oder 0,5 px/ms, sonst federt es zurück.</li><li>Verwendet für: Mehr, Als PDF herunterladen (Kompakt/Getrennt), Lösungen (Waagerecht/Senkrecht), Fragenliste.</li></ul>`],
["Spielablauf",`<ul><li><b>Prüfen:</b> markiert richtige Buchstaben grün (Schrift + 16 % Tönung, jede richtige Kachel mit kleinem Haken unten rechts) und falsche rot (Schrift + Tönung + Diagonale). Auf dem gelben Cursorfeld bleibt die Schrift schwarz, Status als Innenrand #0b6b35 bzw. #b3001b. Tipp und Buchstabe aufdecken; aufgedeckte Buchstaben tragen die blaue Ecke unten links.</li><li><b>Wort gelöst:</b> grünes Aufleuchten, gestaffelt in höchstens 300 ms, dann „✓ Richtig · Warum? · Weiter →“. Erklärungen optional automatisch.</li><li><b>Endscreen:</b> „Gut gemacht!“ (gelöst) oder „Dicht dran.“ (über „Rätsel beenden“), jeweils mit Lösungen.</li><li>Nummern-Pille zählt beim Wechsel hoch oder runter (120–320 ms).</li><li><b>Cursor auf falschem Buchstaben:</b> Gelb bleibt, Buchstabe schwarz, dunkelroter Innenrand und Diagonale – in Raster und Antwortfeld gleich.</li><li><b>Fragenliste:</b> spiegelt das Tippen live – aktive Frage mit Nummern-Pille und Kacheln (Cursor gelb, Fehler rot, aufgedeckt mit blauer Ecke), „n falsch“ bei Prüfen rechts in der Felderzeile, gelöste Fragen mit grüner Lösung und Haken im Feld; Fragen werden nie abgeschnitten.</li></ul>`],
["Speichern",`<ul><li>Prototyp: localStorage – <code>udeg-state</code> (Einträge, aufgedeckte Felder, aktuelle Frage, Zeit), <code>udeg-fragen</code>, <code>udeg-wachs</code>, <code>udeg-erkl</code>, <code>udeg-skip</code>, <code>udeg-zeit</code>, <code>udeg-beta</code>.</li><li>Produktion: Spielstand und Ergebnis am Konto speichern („Wir haben Ihr Ergebnis gespeichert“), localStorage nur als Zwischenspeicher.</li></ul>`],
["Bewegung und Barrierefreiheit",`<ul><li>prefers-reduced-motion: Bewegungen werden zu Überblendungen.</li><li>Hochfrequentes (Tastendruck, Cursor) ohne oder mit sehr kurzer Animation; nur transform und opacity animieren.</li><li>Fokus-Ringe blau, Live-Region für Ansagen („Richtig: SAUERTEIG“), alles per Tastatur bedienbar, Dialoge mit Fokusfalle.</li></ul>`],
["Angular: Empfehlungen",`<ul><li><b>Angular CDK als Basis:</b> Overlay und Dialog (<code>@angular/cdk/dialog</code>) für Sheets und Modals mit Scroll-Sperre (BlockScrollStrategy); <code>@angular/cdk/a11y</code> für FocusTrap, LiveAnnouncer, FocusMonitor; <code>@angular/cdk/layout</code> (BreakpointObserver) für Handy, Tablet, Desktop. Das Material-Bottom-Sheet kann kein Wischen zum Schließen – besser CDK plus eigene Geste.</li><li><b>Gesten:</b> <code>@use-gesture/vanilla</code> in einer Direktive (filterTaps, axis lock, Tempo) für Karussell, Sheets und das Einrasten der Seite. HammerJS (Angulars alte HammerModule-Anbindung) wird nicht mehr gepflegt – vermeiden.</li><li><b>Zoom und Pan:</b> <code>@panzoom/panzoom</code> (frameworkfrei) oder die eigene Kamera aus dem Prototyp (requestAnimationFrame + transform).</li><li><b>Performance:</b> Pointer- und Touch-Listener außerhalb der Zone (NgZone.runOutsideAngular) oder zoneless; Zustand mit Signals; passive: false nur dort, wo preventDefault nötig ist.</li><li><b>Animationen:</b> CSS-Transitions; seit Angular 20.2 animate.enter und animate.leave statt <code>@angular/animations</code> (dort als veraltet markiert).</li><li><b>Eigenbau:</b> Tastatur, Tasten-Lupe und Kamera – dafür gibt es keine passende Library; Logik und Werte aus dem Prototyp übernehmen.</li><li><b>Tests:</b> Gesten in Playwright mit echten Touch-Eingaben (CDP Input.dispatchTouchEvent) prüfen; synthetische Events zeigen Timing-Probleme nicht.</li></ul>`],["Gamefeel: Bewegung, Ton und Haptik","<p><b>Eingabe</b></p><ul><li>Buchstabe gesetzt: Antwortfeld und Rasterbuchstabe „ploppen“ – 160 ms, cubic-bezier(.2,0,0,1), Skalierung 0,55 → 1,08 → 1, Deckkraft 0,3 → 1. Aufgedeckte Felder ploppen nicht.</li><li>Cursor gleitet innerhalb des Worts in 80 ms; beim Wortwechsel springt er ohne Animation.</li><li>Nach jedem Buchstaben rückt der Cursor ein Feld weiter, belegte Felder werden übersprungen (Einstellung), am Wortende bleibt er stehen. Kein automatischer Sprung zur nächsten Frage.</li><li>Während des Tippens blenden Prüfen-Meldung und Zoom-Pille aus (150 ms) und kommen 1,5 s nach dem letzten Buchstaben zurück (nicht am Desktop).</li><li>Löschen leert das Feld; ist es leer, geht der Cursor zurück und leert dort. Aufgedeckte Felder bleiben.</li></ul><p><b>Wort gelöst</b></p><ul><li>Antwortfelder: Welle von links, je Feld 260 ms, Skalierung 1 → 1,06 → 1. Versatz je Feld = min(35 ms, 300 ms / Feldzahl).</li><li>Raster: die Kacheln des Worts blitzen grün (Success 55 % → Fläche) in 500 ms ease-out, gleicher Versatz. Cursor und Wortrahmen blenden aus.</li><li>Erklärung „So ist es gemeint“ kommt in 300 ms ease-out herein (12 px von unten, 4 px Unschärfe → scharf).</li><li>Dazu Ton „richtig“ und Haptik zweimal (0 und 90 ms).</li></ul><p><b>Prüfen</b></p><ul><li>Einschalten startet eine Welle über das ganze Raster ab der Cursor-Kachel: 45 ms Verzögerung je Kachel Abstand.</li><li>Leere Kacheln 480 ms grauer Schimmer (Text/100 7 %), richtige 480 ms grün (Success 28 %), falsche 600 ms rot (Error 35 %) – bewusst in Stufen (steps 4 bzw. 5).</li><li>Meldung und Ton folgen nach der Welle, spätestens nach 500 ms.</li></ul><p><b>Fehler / Wackeln</b></p><ul><li>Die Antwortzeile wackelt nur, wenn das letzte freie Feld gefüllt wird und das Wort dann falsch ist: 320 ms ease-out, −6 / +5 / −3 / +2 px. Nicht bei Teileingaben, nicht durch „Prüfen“.</li><li>Dazu tiefer Ton, längere Vibration (30 ms) und die Ansage „Noch nicht richtig“.</li></ul><p><b>Tastatur (Handy, Tablet)</b></p><ul><li>Aufsetzen: Taste dunkel, Lupe sofort da, Haptik und Tick. Mit Lupe zählt der Buchstabe beim Loslassen, ohne Lupe beim Aufsetzen.</li><li>Lupe verschwindet in 120 ms (Deckkraft, Skalierung auf 0,94). Loslassen mehr als 8 px außerhalb der Tastatur verwirft die Eingabe.</li><li>Gleiten: erst ab 10 px Fingerweg; die Nachbartaste zählt, wenn der Finger mehr als 4 px in ihr liegt; jeder Wechsel gibt Haptik. Setzt ein zweiter Finger auf, zählt der erste sofort.</li><li>Löschen: sofort; beim Halten nach 450 ms alle 90 ms, jeweils mit Haptik und Tick.</li></ul><p><b>Ton und Haptik</b></p><ul><li>Töne (Sinus, 8 ms Anstieg, dann ausklingend, sehr leise): richtig 660 Hz 0,22 s + 990 Hz 0,32 s (80 ms versetzt); falsch 180 Hz 0,18 s; Aufdecken 880 Hz 0,18 s.</li><li>Tick: 12 ms Rauschen, Tiefpass 1300 Hz (Buchstabe) bzw. 900 Hz (Funktionstaste).</li><li>Audio als „ambient“ – stumm bei Stummschalter. Töne und Haptik einzeln abschaltbar, Standard an.</li><li>Haptik: 7 ms bei Tastendruck, Gleiten, Löschen-Wiederholung und Fragenwechsel per Wisch; „richtig“ zweimal; „falsch“ 30 ms. Auf iOS behilft sich der Prototyp mit einem unsichtbaren Schalter – im Produkt eigene Lösung prüfen.</li></ul><p><b>Raster-Kamera und Zoom</b></p><ul><li>Pille: Faktor 1,5 je Tipp um die Cursor-Kachel, 320 ms. Doppeltipp: auf 200 % bzw. zurück auf 100 %. Strg + Mausrad und Pinch stufenlos, 100–300 %.</li><li>Wortwechsel bei Zoom: Kamerafahrt 320 ms, cubic-bezier(.2,0,0,1), Wort mit einer Kachel Rand. Cursor folgen: 200 ms. Jede Geste unterbricht die Fahrt.</li><li>Verschieben ab 6 px Fingerweg; danach werden Klicks 300 ms ignoriert.</li></ul><p><b>Fragenwechsel</b></p><ul><li>Pfeile: alte Frage raus in 120 ms (8 px, leichte Unschärfe), neue rein in 200 ms. Höhe der Karte: wachsen 300 ms, schrumpfen 150 ms.</li><li>Wischen: Richtung nach 8 px entschieden, Inhalt folgt dem Finger 1:1, Nachbarfragen laufen mit (24 px Abstand). Wechsel ab 25 % Breite oder Tempo über 0,3 px/ms; Ausrollen 120–250 ms, Zurückfedern 250 ms.</li><li>Schalter „Fragen“: Liste 150 ms raus bzw. 200 ms rein (12 px seitlich), das Raster skaliert in 200 ms auf die neue Größe.</li></ul><p><b>Sheet, Liste, Seite</b></p><ul><li>Sheet: von unten in 300 ms, zu in 200 ms. Ziehen schließt ab 25 % Höhe oder Tempo über 0,5 px/ms; nach oben nur mit Widerstand (Faktor 0,15).</li><li>Die Liste folgt dem aktiven Wort (weich auf ein Drittel der Höhe) und zeigt Eingaben live. Festgehaltener Trenner: Schatten
